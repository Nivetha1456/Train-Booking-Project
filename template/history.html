<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> My Bookings </title>

    <style>

body{
    margin:0;
    padding:30px;
    font-family:Arial, sans-serif;
     

    background:linear-gradient(
        rgba(0,0,0,0.5),
        rgba(0,0,0,0.5)
    ),
     url("/static/railway-2.png") ; 

    background-size:cover;
    background-position:center;
    background-attachment:fixed;
}

.booking-box{
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,0.3);
}

h2{
    text-align:center;
    color:black;
    margin-bottom:25px;
}

.search-box{
    text-align:center;
    margin-bottom:25px;
}

.search-box input{
    width:300px;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

.search-box button{
    padding:12px 25px;
    border:none;
    background:#0d6efd;
    color:white;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
    margin-left:10px;
}

.search-box button:hover{
    background:#084fc7;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
}

th{
    background:#0d6efd;
    color:white;
    padding:15px;
}

td{
    padding:12px;
    text-align:center;
}

tr:nth-child(even){
    background:#f8f9fa;
}

tr:hover{
    background:#eaf2ff;
}

table,th,td{
    border:1px solid #ddd;
}

</style>

</head>
<body>
    <div class="booking-box">

    <h2> MY BOOKINGS </h2>

    <form method="POST" class="search-box">

        {% csrf_token %}

        <input type="text"
               name="mobile"
               placeholder="Enter Mobile Number"
               required>

        <button type="submit">
            Search
        </button>

    </form>

    {% if bookings %}

    <table>

        <tr>
            <th>PNR</th>
            <th>Train Name</th>
            <th>Route</th>
            <th>Journey Date</th>
            <th>Class</th>
            <th>Total Price</th>
        </tr>

        {% for b in bookings %}

        <tr>
            <td>{{ b.pnr }}</td>
            <td>{{ b.train_name }}</td>
            <td>{{ b.source }} → {{ b.destination }}</td>
            <td>{{ b.journey_date }}</td>
            <td>{{ b.class }}</td>
            <td>₹{{ b.total_price }}</td>
        </tr>

        {% endfor %}

    </table>

    {% endif %}

</div>
</body>
</html>
