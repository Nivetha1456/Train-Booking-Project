


 <style>
body{
    margin:0;
    padding:0;
    font-family:Arial, sans-serif;

    background:linear-gradient(
        rgba(0,0,0,0.4),
        rgba(0,0,0,0.4)
    ),
    url("/static/railway-2.png") ; 

    background-size:cover;
    background-position:center;
    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;
}

.login-box{
    width:380px;
    background:white;
    padding:40px;
    border-radius:15px;
    box-shadow:0 10px 30px rgba(0,0,0,0.3);

    text-align:center;
}

.login-box h2{
    color:#0d6efd;
    margin-bottom:30px;
    font-size:35px;
}

.login-box input{
    width:100%;
    padding:12px;
    margin-bottom:20px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
    box-sizing:border-box;
}

.login-btn{
    width:100%;
    background:#0d6efd;
    color:white;
    border:none;
    padding:12px;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;
}

.login-btn:hover{
    background:#084fc7;
}

.register-link{
    margin-top:20px;
}

.register-link a{
    text-decoration:none;
    color:#0d6efd;
    font-weight:bold;
}



.alert-success{
    width:300px;
    margin:0px auto;
    padding:12px;
    background:#d4edda;
    color:#155724;
    border:2px solid #c3e6cb;
    border-radius:8px;
    text-align:center;
    font-weight:bold;
}



.register-link{
    margin-top:20px;
    text-align:center;
    font-size:15px;
    color:#555;
}

.register-link a{
    color:#0d6efd;
    text-decoration:none;
    font-weight:bold;
    margin-left:5px;
}

.register-link a:hover{
    
    color:#0056b3;
}
</style>


<div class="login-box">

{% if messages %}
    {% for message in messages %}
        <div class="alert-success">
            {{ message }}
        </div>
    {% endfor %}
{% endif %}



    <h2> Login</h2>


   <form method="POST" autocomplete="off"> 
    
    {% csrf_token %}

    <input
        type="email"
        name="email"
        placeholder="Enter Email"
        autocomplete="new-email"
        required>

    <input
        type="password"
        name="password"
        placeholder="Enter Password"
        autocomplete="new-password"
        required>

    <button type="submit" class="login-btn">
        Login
    </button>
</form>



<div class="register-link">
    <span>Don't have an account? </span>
    <a href="{% url 'register' %}">
        Register
    </a>
 </div>
