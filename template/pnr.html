

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PNR status</title>

    <style>

 body{
    margin:0;
    padding:0;
    font-family:Arial, sans-serif;

    background:linear-gradient(
        rgba(0,0,0,0.4),
        rgba(0,0,0,0.4)
    ),
    /* url("/static/train images.png"); */
      url("/static/railway-2.png") ; 

     background-size:cover;
    background-position:center;
    background-attachment:fixed;

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;
}

.pnr-box{
    width:600px;
    background:white;
    padding:35px;
   
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,0.3);
}

.pnr-box h2{
    text-align:center;
    color:black;
    margin-bottom:25px;
}

label{
    font-weight:bold;
}

input{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:1px solid #ccc;
    border-radius:8px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:12px;
    margin-top:20px;
    background:#0d6efd;
    color:white;
    border:none;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#084fc7;
}

.ticket-table{
    width:100%;
    border-collapse:collapse;
    margin-top:25px;
}

.ticket-table th{
    background:white;
    color:black;
    padding:12px;
    width:40%;
}

.ticket-table td{
    padding:12px;
    background:#f8f9fa;
}

.ticket-table th,
.ticket-table td{
    border:1px solid #ddd;
} 




 .container{
    width:700px;
    margin:60px auto;
    background:#fff;
    padding:40px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,.3);

    /* LEFT ALIGN */
    text-align:left;
}



h2{
    text-align:center;
    margin-bottom:30px;
}

label{
    display:block;
    font-size:22px;
    font-weight:bold;
    margin-bottom:10px;
}

input{
    width:100%;
    padding:12px;
    margin-bottom:20px;
}

button{
    width:100%;
    padding:12px;
}

h3{
    text-align:center;
    margin:25px 0;
}




table{
    width:100%;
    border-collapse:collapse;
}

th,
td{
    border:1px solid #ccc;
    padding:12px;
}

th{
    width:40%;
    text-align:left;
    background:#f5f5f5;
}

td{
    text-align:left;
}




</style>
</head>
<body>
    <div class="pnr-box">

<h2> PNR STATUS CHECK </h2>

<form method="POST">
    {% csrf_token %}

    <label>Enter PNR Number:</label>

    <input type="text"
           name="pnr"
           placeholder="Enter PNR Number"
           required>

    <button type="submit">
        Check Status
    </button>
</form>

{% if booking %}

<h3 style="text-align:center;">TICKET DETAILS</h3>

<table class="ticket-table">

    <tr>
        <th>PNR</th>
        <td>{{ booking.pnr }}</td>
    </tr>

    <tr>
        <th>Train Name</th>
        <td>{{ booking.train_name }}</td>
    </tr>

    <tr>
        <th>Route</th>
        <td>{{ booking.source }} → {{ booking.destination }}</td>
    </tr>

    <tr>
        <th>Journey Date</th>
        <td>{{ booking.journey_date }}</td>
    </tr>

    <tr>
        <th>Class</th>
        <td>{{ booking.class }}</td>
    </tr>

</table>

{% endif %}

</div>
</body>
</html>
