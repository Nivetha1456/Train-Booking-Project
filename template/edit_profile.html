
 {% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

<style>

 body{
    font-family: Calibri, sans-serif;
    
    background:#eef3f8; 
    margin:0;
    padding:50px;
    font-size:15px;
     background:linear-gradient(
        rgba(0,0,0,0.6),
        rgba(0,0,0,0.6)
    ),
    
    url("/static/railway-2.png");   
    padding: 0;
    background-size: cover;
    height: 100vh;
}



  .profile-card{

    width:700px;

    background:rgba(255,255,255,.92);
    

    border-radius:25px;

    padding:40px 50px;

     box-shadow:0 20px 50px rgba(0,0,0,.35);  
      

     backdrop-filter:blur(15px);  

     text-align:center; 
     top: 120px;  
        
}   


.profile-card h1{

    color:#1d4ed8;

    font-size:20px;

    margin-bottom:30px;

    letter-spacing:2px;
}

.input-group{

    text-align:left;

    margin-bottom:20px;
}

.input-group label{

    display:block;

    font-weight:bold;

    margin-bottom:8px;

    color:black;
}

.input-group input{

    width:100%;

    height:40px;
       
    padding:0 18px;

    border:1px solid #d6d6d6;

    border-radius:10px;

    font-size:15px;

    box-sizing:border-box;

    transition:.3s;
}

.input-group input:focus{

    border:2px solid #2563eb;

    outline:none;

    box-shadow:0 0 12px rgba(37,99,235,.25);
} 

button{

    width:30%;

    height:50px;

    border:none;

    border-radius:12px;

    background:linear-gradient(90deg,#1d4ed8,#2563eb);

    color:white;

    font-size:18px;

    font-weight:bold;

    cursor:pointer;

    transition:.3s;
}

button:hover{

    transform:translateY(-3px);

    box-shadow:0 10px 25px rgba(0,0,0,.25);
}







  body {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    background: url("/static/railway-2.png") no-repeat center center fixed;
    background-size: cover;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}  


   .form-container {
    background-color: #ffffff;  
    padding: 30px;
    border-radius: 10px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    width: 4000px;
    text-align: center;
}   


.form-container h2 {
    color: #007BFF; 
    margin-bottom: 20px;
}


 .form-container input {
    width: 100%;
    padding: 10px;
    margin: 10px 0;
    border: 1px solid #ccc;
    border-radius: 5px;
} 


 .form-container button {
    width: 100%;
    padding: 12px;
    background-color: #007BFF;
    
    border: none;
    border-radius: 5px;
    font-size: 16px;
    cursor: pointer;
} 

.form-container button:hover {
    background-color: #0056b3;
}

   .profile-icon {
    width: 80px;
    height: 80px;
    border-radius: 50%;   
    margin-bottom: 15px;
    display: block;
    margin-left: auto;
    margin-right: auto;   
} 



.input-group select{
    width:100%;
    height:40px;
    padding:0 15px;
    border:1px solid #d9d9d9;
    border-radius:10px;
    background:white;
    font-size:16px;
    outline:none;
    cursor:pointer;
    transition:.3s;
}

.input-group select:focus{
    border:2px solid #2563eb;
    box-shadow:0 0 12px rgba(37,99,235,.25);
}




.profile-card{
    width:700px;
    margin:100px auto 50px;   
    padding:200px 50px 40px;   
    position:relative;
}




.popup-error{
    background:#ffdddd;
    color:#b30000;
    padding:12px 20px;
    border-left:6px solid red;
    border-radius:8px;
    margin:15px auto;
    width:80%;
    text-align:center;
    font-weight:bold;
}


</style>


</head>
<body>







    <div class="profile-card">

   
      <img src="{% static 'ICONS-1.png' %}" alt="Profile Icon" class="profile-icon"> 

    <h1>EDIT PROFILE</h1>

    



     <form method="POST" action="{% url 'edit_profile' %}">
        {% csrf_token %}

         


<div class="input-group">
                <label>Name</label>
                <input type="text" name="name" value="{{ name }}">
            </div>

            <div class="input-group">
                <label>Email</label>
                <input type="email" name="email" value="{{ email }}">
            </div>

            <div class="input-group">
                <label>Date of Birth</label>
                <input type="date" name="dateofbirth" value="{{ dateofbirth }}">
            </div>

            


            <div class="input-group">
                <label>Gender</label>

                <select name="gender">
                   <option value="Male" {% if gender == "Male" %}selected{% endif %}>Male</option>
                   <option value="Female" {% if gender == "Female" %}selected{% endif %}>Female</option>
                   <option value="Other" {% if gender == "Other" %}selected{% endif %}>Other</option>
             </select>
           </div>



            <div class="input-group">
                <label>Phone Number</label>
                <input type="text" name="phonenumber" value="{{ phonenumber }}">
            </div>

            <div class="input-group">
                <label>Address</label>
                <input type="text" name="address" value="{{ address }}">
            </div>

            <div class="input-group">
                <label>City</label>
                <input type="text" name="city" value="{{ city }}">
            </div>

            <div class="input-group">
                <label>State</label>
                <input type="text" name="state" value="{{ state }}">
            </div>

            <div class="input-group">
                <label>Pincode</label>
                <input type="text" name="pincode" value="{{ pincode }}">
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password" name="password" value="{{ password }}">
            </div>

            <div class="input-group">
                <label>Confirm Password</label>
                <input type="password" name="confirmpassword" value="{{ confirmpassword }}">
            </div>

            <button type="submit">Save Profile</button>
        
    

    </form>



{% if error %}
<div class="popup-error">
    {{ error }}
</div>
{% endif %}



</div>


</body>
</html>
