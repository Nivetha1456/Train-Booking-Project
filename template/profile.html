

<!DOCTYPE html>
<html>

<head>

<title>Profile</title>

<style>

   body{
    font-family: Calibri, sans-serif;

     background:#eef3f8; 
    margin:0;
    padding:80px;
    font-size:15px;
     background:linear-gradient(
        rgba(0,0,0,0.6),
        rgba(0,0,0,0.6)
    ),
    
    url("/static/railway-2.png") ;     
}   


.box{
    width:800px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,0.15);
}

.box h2{
    color:black;
    font-size:30px;
    margin-bottom:20px;
    /* border-bottom:3px solid #003366; */
    padding-bottom:10px;
}

table{
    width:100%;
    border-collapse:collapse;
}

table td{
    padding:15px;
    border:1px solid #ddd;
}

table td:first-child{
    width:35%;
    font-weight:bold; 
     background-color: white; 
    color:black;
    font-size: 17px;
}

table td:last-child{
    background:white;
    font-size: 17px;
}

.edit-btn{
    float:right;
    background:#0d6efd;
    color:white;
    padding:10px 18px;
    text-decoration:none;
    border-radius:8px;
    font-weight:bold;
    transition:0.3s;
}

.edit-btn:hover{
    background:#084298;
}

.profile-icon{
    font-size:30px;
    margin-right:10px;
}

.password{
    letter-spacing:3px;
    color:#555;
} 




</style>

</head>

<body>


 <div class="box">

<div style="float:right;">

    <a href="{% url 'edit_profile' %}"
       style="
       background:#eef3f8;
       border:1px solid #007bff;
       color:#007bff;
       padding:6px 12px;
       text-decoration:none;
       border-radius:4px;
       font-size:13px;
       font-weight:bold;
       ">
       Edit 
    </a>

</div>


<h2>MY PROFILE</h2> 

<div style="text-align:center; margin-bottom:20px;">
    
</div>


<table border="1" width="100%" cellpadding="10"> 

    <tr>
         <td><b>Name</b>
        </td> <td>{{ name }}</td>
     </tr>


      <tr> 
        <td><b>Email</b></td>
         <td>{{ email }}</td> 
        </tr>


         <tr>
             <td><b>Date of Birth</b></td>
              <td>{{ dateofbirth }}</td>
             </tr>



               <tr> 
                <td><b>Gender</b></td> 
                <td>{{ gender }}</td>
             </tr>


             <tr>
                 <td><b>Phone Number</b></td>
                  <td>{{ phonenumber }}</td>

             </tr>


              <tr>
                 <td><b>Address</b></td>
                  <td>{{ address }}</td> 

             </tr> 


             <tr>
                 <td><b>City</b></td>
                  <td>{{ city }}</td> 

             </tr> 


             <tr>
                 <td><b>State</b></td>
                  <td>{{ state }}</td> 

             </tr>


             <tr>
                 <td><b>Pincode</b></td>
                  <td>{{ pincode }}</td> 

             </tr>
