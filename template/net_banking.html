{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Net Banking</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{

    background:url("{% static 'background_4.png' %}");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;
}

.container{

    width:500px;
    background:#fff;
    padding:35px;
    border-radius:15px;
    box-shadow:0 10px 30px rgba(0,0,0,.3);
      

}

h1{

    text-align:center;
    color:darkblue;
    margin-bottom:20px;

}

.amount{

    text-align:center;
    color:green;
    font-size:25px;
    font-weight:bold;
    margin-bottom:25px;

}

label{

    display:block;
    margin-top:18px;
    margin-bottom:8px;
    font-weight:bold;
    /* color:#333; */
    color:black;

}

select,
input{

    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;

}

.pay-btn{

    width:100%;
    margin-top:30px;
    padding:14px;

    background:darkgreen;
    color:white;

    border:none;
    border-radius:8px;

    font-size:18px;
    font-weight:bold;

    cursor:pointer;

}

.pay-btn:hover{

    background:green;

}

.note{

    margin-top:18px;
    text-align:center;
    color:#333;
    font-size:14px;

}



.pay-btn{
    position:relative;
    width:100%;
    height:55px;

    background:darkblue;
    color:white;

    border:none;
    border-radius:8px;

    font-size:18px;
    font-weight:bold;

    cursor:pointer;

    transition:.3s;
}

.pay-btn:hover{
    background: #001f70;
}

.pay-text{
    display:block;
    text-align:center;
    color:white;
}

.lock-icon{
    position:absolute;
    right:20px;
    top:50%;
    transform:translateY(-50%);

    color:white;
    font-size:18px;
}






</style>

</head>

<body>

<div class="container">

<h1> NET BANKING</h1>

<div class="amount">
Amount : ₹{{ total_price }}
</div>



<form method="POST">

{% csrf_token %}
<div>

<label>Select Bank</label>

<select name="bank" required>

<option value="">Choose Your Bank</option>

<option>State Bank of India (SBI)</option>

<option>Indian Bank</option>

<option>Indian Overseas Bank (IOB)</option>

<option>Canara Bank</option>

<option>Bank of Baroda</option>

<option>Punjab National Bank</option>

<option>HDFC Bank</option>

<option>ICICI Bank</option>

<option>Axis Bank</option>

<option>Kotak Mahindra Bank</option>

</select>

</div>



<label>User ID</label>

<input
type="text"
name="userid"
placeholder="Enter User ID"
required>




<label>Password</label>

<input
type="password"
name="password"
placeholder="Enter Password"
required>





<button type="submit" class="pay-btn">

    <span class="pay-text">
        PAY NOW ₹{{ total_price }}
    </span>

    <i class="fa-solid fa-lock lock-icon"></i>

</button>

</form>

<div class="note">
Your transaction is protected with 256-bit SSL encryption.
</div>

</div>

</body>
</html>
